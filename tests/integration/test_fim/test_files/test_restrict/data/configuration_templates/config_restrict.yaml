- sections:
    - section: syscheck
      elements:
        - disabled:
            value: 'no'
        - frequency:
            value: 2
        - directories:
            value: TEST_DIRECTORIES
            attributes:
              - check_all: 'yes'
              - FIM_MODE
              - restrict: RESTRICT
        - synchronization:
          # Disabling sync since asp_sync_module isn't simulated yet
          # fim_run_registry waits on that method to complete and
          # this makes the first file monitor events take a while to appear
          # making the invalid_character tests fail
            elements:
              - interval:
                  value: 5
              - enabled:
                  value: "no"
    - section: sca
      elements:
        - enabled:
            value: 'no'
    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'
    - section: wodle
      attributes:
        - name: syscollector
      elements:
        - disabled:
            value: 'yes'
