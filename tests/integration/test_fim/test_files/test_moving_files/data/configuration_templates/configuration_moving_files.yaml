- sections:
    - section: syscheck
      elements:
      - disabled:
          value: 'no'
      - directories:
          value: TEST_DIR_1
          attributes:
            - whodata: 'yes'
      - directories:
          value: TEST_DIR_2
          attributes:
            - realtime: 'yes'
      - synchronization:
          # Disabling sync since asp_sync_module isn't simulated yet
          # fim_run_registry waits on that method to complete and
          # this makes the first file monitor events take a while to appear
          # making the invalid_character tests fail
          elements:
            - interval:
                value: 5
            - enabled:
                value: "no"

    - section: sca
      elements:
        - enabled:
            value: 'no'

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: wodle
      attributes:
        - name: syscollector
      elements:
        - disabled:
            value: 'yes'

    - section: active-response
      elements:
        - disabled:
            value: 'yes'
