- sections:
    - section: syscheck
      elements:
        - disabled:
            value: 'no'
        - frequency:
            value: 3
        - directories:
            value: TEST_DIRECTORIES
            attributes: ATTRIBUTES
        - directories:
            value: TEST_DIRECTORIES_NO_DIFF
            attributes: ATTRIBUTES
        - nodiff:
            value: NODIFF_FILE
        - synchronization:
          # Disabling sync since asp_sync_module isn't simulated yet
          # fim_run_registry waits on that method to complete and
          # this makes the first file monitor events take a while to appear
          # making the invalid_character tests fail
            elements:
              - interval:
                  value: 5
              - enabled:
                  value: "no"

    - section: sca
      elements:
        - enabled:
            value: 'no'

    - section: rootcheck
      elements:
        - disabled:
            value: 'yes'

    - section: wodle
      attributes:
        - name: syscollector
      elements:
        - disabled:
            value: 'yes'
