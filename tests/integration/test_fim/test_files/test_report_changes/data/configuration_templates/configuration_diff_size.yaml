- sections:
    - section: syscheck
      elements:
      - disabled:
          value: 'no'
      - frequency:
            value: 3
      - directories:
          value: TEST_DIRECTORIES
          attributes: ATTRIBUTES
      - diff:
          elements:
            - file_size:
                elements:
                  - enabled:
                      value: FILE_SIZE_ENABLED
                  - limit:
                      value: FILE_SIZE_LIMIT
            - disk_quota:
                elements:
                  - enabled:
                      value: DISK_QUOTA_ENABLED
                  - limit:
                      value: DISK_QUOTA_LIMIT
      - synchronization:
          # Disabling sync since asp_sync_module isn't simulated yet
          # fim_run_registry waits on that method to complete and
          # this makes the first file monitor events take a while to appear
          # making the invalid_character tests fail
            elements:
                - interval:
                    value: 5
                - enabled:
                    value: "no"

    - section: sca
      elements:
        - enabled:
            value: 'no'
